<!DOCTYPE html>
<html lang="fr" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#144f64" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Signalements — Résidence</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="app.css" />
  <style>html.auth-pending body{background:#144f64}html.auth-pending body>*{visibility:hidden}</style>
</head>
<body>
  <header class="topbar">
    <div class="appbar">
      <div>
        <p class="eyebrow" style="margin:0;">Résidence · Signalements</p>
        <h1 style="font-size:1.3rem;margin:2px 0 0;">🔧 Signalements</h1>
      </div>
      <span class="who"><a id="out" style="color:#fff;cursor:pointer;">verrouiller</a></span>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <span class="grow">Tous les signalements</span>
      <a class="btn" href="case.html">+ Nouveau</a>
    </div>
    <div id="list"><p class="empty">Chargement…</p></div>
    <footer><a href="../index.html">← Retour au guide</a></footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/gate-config.js?v=3"></script>
  <script src="../assets/auth.js?v=3" data-base=".." data-gate="1"></script>
  <script src="supabase-config.js"></script>
  <script src="../assets/nav.js" data-base=".."></script>
  <script src="app.js"></script>
  <script>
    (async function () {
      document.getElementById("out").addEventListener("click", function () {
        if (window.SiteAuth) SiteAuth.signOut();
      });

      const { data, error } = await CaseApp.listCases();
      const list = document.getElementById("list");
      if (error) {
        list.innerHTML = '<div class="msg err">' + CaseApp.esc(error.message) + "</div>";
        return;
      }
      if (!data || data.length === 0) {
        list.innerHTML = '<p class="empty">Aucun signalement pour l\'instant.<br>Clique sur « + Nouveau ».</p>';
        return;
      }
      list.innerHTML = data.map(function (c) {
        const date = new Date(c.created_at).toLocaleDateString("fr-FR");
        const who = c.reporter_name ? CaseApp.esc(c.reporter_name) + " · " : "";
        return (
          '<a class="case-item" href="case.html?id=' + c.id + '">' +
            '<div class="row1"><span class="title">' + CaseApp.esc(c.title) + "</span>" +
              CaseApp.statusBadge(c.status) + "</div>" +
            '<div class="meta">' + who +
              (c.location ? "📍 " + CaseApp.esc(c.location) + " · " : "") + date + "</div>" +
          "</a>"
        );
      }).join("");
    })();
  </script>
</body>
</html>
