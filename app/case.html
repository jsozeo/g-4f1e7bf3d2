<!DOCTYPE html>
<html lang="fr" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#144f64" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Signalement — Résidence</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="app.css" />
  <style>html.auth-pending body{background:#144f64}html.auth-pending body>*{visibility:hidden}</style>
</head>
<body>
  <header class="topbar">
    <div class="appbar">
      <div>
        <p class="eyebrow" style="margin:0;">Résidence · Signalements</p>
        <h1 id="pageTitle" style="font-size:1.3rem;margin:2px 0 0;">🔧 Nouveau signalement</h1>
      </div>
      <span class="who"><a href="index.html" style="color:#fff;">← liste</a></span>
    </div>
  </header>

  <main class="wrap">
    <div id="msg"></div>

    <div class="panel">
      <div class="field">
        <label for="reporter">Ton prénom / qui signale *</label>
        <input id="reporter" type="text" required placeholder="Ex : Marie" />
      </div>
      <div class="field">
        <label for="title">Titre du dysfonctionnement *</label>
        <input id="title" type="text" required placeholder="Ex : Fuite sous l'évier de la cuisine" />
      </div>
      <div class="field">
        <label for="location">Emplacement</label>
        <input id="location" type="text" placeholder="Ex : Cuisine, RDC" />
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Décris le problème…"></textarea>
      </div>

      <div class="field" id="statusField" style="display:none;">
        <label for="status">Statut</label>
        <select id="status">
          <option value="ouvert">Ouvert</option>
          <option value="en_cours">En cours</option>
          <option value="bloque">Bloqué</option>
          <option value="ferme">Fermé</option>
          <option value="rejete">Rejeté</option>
        </select>
      </div>
      <div class="field" id="statusByField" style="display:none;">
        <label for="statusBy">Qui change le statut ? *</label>
        <input id="statusBy" type="text" placeholder="Ex : Jean" />
      </div>

      <div class="field">
        <label for="photo">Photo (optionnel)</label>
        <input id="photo" type="file" accept="image/*" />
        <div id="photoPreview" style="margin-top:10px;"></div>
      </div>

      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn" id="save" type="button">Enregistrer</button>
        <button class="btn danger" id="del" type="button" style="display:none;">Supprimer</button>
      </div>
    </div>

    <div class="panel" id="history" style="display:none;">
      <h2 style="margin-top:0;font-size:1.05rem;">Historique &amp; commentaires</h2>
      <div id="events"></div>
      <div class="field" style="margin-top:12px;">
        <label for="commentAuthor">Ton prénom</label>
        <input id="commentAuthor" type="text" placeholder="Ex : Marie" />
      </div>
      <div class="field">
        <textarea id="comment" placeholder="Ajouter un commentaire…" style="min-height:70px;"></textarea>
      </div>
      <button class="btn secondary" id="addComment" type="button">Commenter</button>
    </div>

    <footer><a href="index.html">← Retour à la liste</a></footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/gate-config.js?v=3"></script>
  <script src="../assets/auth.js?v=3" data-base=".." data-gate="1"></script>
  <script src="supabase-config.js"></script>
  <script src="../assets/nav.js" data-base=".."></script>
  <script src="app.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const msg = document.getElementById("msg");
      const show = (html, cls) => { msg.innerHTML = '<div class="msg ' + cls + '">' + html + "</div>"; };

      const $reporter = document.getElementById("reporter");
      const $title = document.getElementById("title");
      const $loc = document.getElementById("location");
      const $desc = document.getElementById("description");
      const $status = document.getElementById("status");
      const $statusBy = document.getElementById("statusBy");
      const $photo = document.getElementById("photo");
      const $commentAuthor = document.getElementById("commentAuthor");

      const saved = CaseApp.getSavedName();
      $reporter.value = saved;
      $statusBy.value = saved;
      $commentAuthor.value = saved;

      let current = null;

      async function refreshPhoto() {
        const box = document.getElementById("photoPreview");
        if (current && current.photo_path) {
          const url = await CaseApp.photoUrl(current.photo_path);
          box.innerHTML = url ? '<img src="' + url + '" alt="photo" style="max-width:100%;border-radius:10px;">' : "";
        } else { box.innerHTML = ""; }
      }

      async function renderEvents() {
        const { data } = await CaseApp.listEvents(id);
        const box = document.getElementById("events");
        if (!data || !data.length) {
          box.innerHTML = '<p class="empty" style="padding:12px;">Aucun événement.</p>';
          return;
        }
        box.innerHTML = data.map(function (e) {
          const ts = new Date(e.created_at).toLocaleString("fr-FR");
          const who = e.author_name ? CaseApp.esc(e.author_name) + " · " : "";
          return '<div class="event ' + e.type + '"><div>' + CaseApp.esc(e.body || "") +
            '</div><div class="ts">' + who + ts + "</div></div>";
        }).join("");
      }

      if (id) {
        document.getElementById("pageTitle").textContent = "🔧 Signalement";
        const { data, error } = await CaseApp.getCase(id);
        if (error || !data) { show("Introuvable.", "err"); return; }
        current = data;
        $title.value = data.title || "";
        $loc.value = data.location || "";
        $desc.value = data.description || "";
        $reporter.value = data.reporter_name || saved;
        $status.value = data.status;
        document.getElementById("statusField").style.display = "";
        document.getElementById("statusByField").style.display = "";
        document.getElementById("del").style.display = "";
        document.getElementById("history").style.display = "";
        await refreshPhoto();
        await renderEvents();
      }

      document.getElementById("save").addEventListener("click", async function () {
        const reporter = $reporter.value.trim();
        const fields = {
          title: $title.value.trim(),
          location: $loc.value.trim(),
          description: $desc.value.trim(),
          reporter_name: reporter,
        };
        if (!fields.title) { show("Le titre est obligatoire.", "err"); return; }
        if (!reporter) { show("Indique qui signale (prénom).", "err"); return; }

        try {
          if (!id) {
            const { data, error } = await CaseApp.createCase(fields);
            if (error) throw error;
            if ($photo.files[0]) await CaseApp.uploadPhoto(data.id, $photo.files[0]);
            location.href = "case.html?id=" + data.id;
          } else {
            if ($status.value !== current.status) {
              const by = $statusBy.value.trim();
              if (!by) { show("Indique qui change le statut.", "err"); return; }
              fields.status = $status.value;
              fields.status_changed_by = by;
            }
            const { error } = await CaseApp.updateCase(id, fields);
            if (error) throw error;
            if ($photo.files[0]) {
              await CaseApp.uploadPhoto(id, $photo.files[0]);
              const { data } = await CaseApp.getCase(id);
              current = data;
              await refreshPhoto();
            } else {
              const { data } = await CaseApp.getCase(id);
              current = data;
            }
            await renderEvents();
            show("Enregistré.", "ok");
          }
        } catch (e) { show(CaseApp.esc(e.message || String(e)), "err"); }
      });

      document.getElementById("del").addEventListener("click", async function () {
        if (!confirm("Supprimer définitivement ce signalement ?")) return;
        const { error } = await CaseApp.sb.from("cases").delete().eq("id", id);
        if (error) { show(CaseApp.esc(error.message), "err"); return; }
        location.href = "index.html";
      });

      document.getElementById("addComment").addEventListener("click", async function () {
        const body = document.getElementById("comment").value.trim();
        const author = $commentAuthor.value.trim();
        if (!body) return;
        if (!author) { show("Indique ton prénom pour commenter.", "err"); return; }
        const { error } = await CaseApp.addComment(id, body, author);
        if (error) { show(CaseApp.esc(error.message), "err"); return; }
        document.getElementById("comment").value = "";
        await renderEvents();
      });
    })();
  </script>
</body>
</html>
