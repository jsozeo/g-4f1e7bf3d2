<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#144f64" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Connexion — Signalements</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <p class="eyebrow">Résidence · Signalements</p>
      <h1>🔧 Connexion</h1>
    </div>
  </header>

  <main class="wrap">
    <div class="panel" style="margin-top:22px;max-width:420px;margin-inline:auto;">
      <p class="lead" style="color:var(--ink-soft);margin-top:0;">
        Reçois un lien de connexion par email (pas de mot de passe).
      </p>
      <form id="form">
        <div class="field">
          <label for="email">Adresse email</label>
          <input id="email" type="email" required autocomplete="email" placeholder="toi@exemple.com" />
        </div>
        <button class="btn block" id="submit" type="submit">Recevoir le lien</button>
      </form>
      <div id="msg"></div>
    </div>
    <footer><a href="../index.html">← Retour au guide</a></footer>
  </main>

  <script src="../assets/nav.js" data-base=".."></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
  <script>
    (async function () {
      // Déjà connecté ? -> vers la liste.
      if (await CaseApp.getSession()) { window.location.href = "index.html"; return; }
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submit");
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        btn.disabled = true;
        msg.innerHTML = "";
        const email = document.getElementById("email").value.trim();
        const { error } = await CaseApp.signInWithEmail(email);
        if (error) {
          msg.innerHTML = '<div class="msg err">' + CaseApp.esc(error.message) + "</div>";
          btn.disabled = false;
        } else {
          msg.innerHTML = '<div class="msg ok">Lien envoyé ! Vérifie ta boîte mail et clique dessus depuis ce téléphone.</div>';
        }
      });
    })();
  </script>
</body>
</html>
